{% extends "base.html" %}

{% block title %}ContextHire | Sign In{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="{{ url_for('index') }}" style="display: inline-block; margin-bottom: 0.85rem;">
                <img src="{{ url_for('static', filename='img/ContextHire.png') }}" alt="ContextHire" style="height: 52px; width: auto; object-fit: contain;">
            </a>
            <h1 style="font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-main);">
                Welcome Back
            </h1>
            <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.35rem;">
                Sign in to your hiring intelligence or resume ATS account.
            </p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-prime" style="width: 100%; justify-content: center; margin-top: 0.75rem; padding: 0.85rem; font-size: 0.95rem;">
                Sign In to ContextHire
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-muted);">
            Don't have an account yet? 
            <a href="{{ url_for('register') }}" style="color: var(--brand-teal); text-decoration: none; font-weight: 600;">Create free account</a>
        </div>
    </div>
</div>
{% endblock %}
